<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#1a1240"/><stop offset="0.6" stop-color="#0a0d1f"/><stop offset="1" stop-color="#05080d"/>
    </radialGradient>
    <linearGradient id="helm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3b57"/><stop offset="1" stop-color="#121a2a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- neon skyline -->
  <g fill="#0d1428" stroke="#ff2bd6" stroke-width="4" filter="url(#glow)" opacity="0.9">
    <path d="M0 512V420h40v-50h34v80h30v-110h40v130h26v-70h36v90h170v-80h36v60h30v-120h38v100h32v-60h20v162z"/>
  </g>
  <!-- kaiju claw slashes -->
  <g stroke="#ff2bd6" stroke-width="18" stroke-linecap="round" filter="url(#glow)">
    <line x1="352" y1="150" x2="440" y2="300"/>
    <line x1="388" y1="132" x2="470" y2="272"/>
    <line x1="318" y1="176" x2="404" y2="326"/>
  </g>
  <!-- mech head -->
  <g filter="url(#glow)">
    <!-- swept-back twin horns -->
    <path d="M214 178 L150 92 L236 160Z M298 178 L362 92 L276 160Z" fill="#ffc83d" stroke="#ffe9a8" stroke-width="4" stroke-linejoin="round"/>
    <!-- helmet -->
    <path d="M256 140 L326 170 L344 250 L322 330 L284 360 H228 L190 330 L168 250 L186 170Z" fill="url(#helm)" stroke="#34e6ff" stroke-width="8" stroke-linejoin="round"/>
    <!-- crest -->
    <path d="M256 140 L272 190 L256 206 L240 190Z" fill="#34e6ff"/>
    <!-- visor -->
    <path d="M192 240 L320 240 L306 272 L206 272Z" fill="#34e6ff"/>
    <!-- mouth vents -->
    <g stroke="#34e6ff" stroke-width="7" stroke-linecap="round">
      <line x1="236" y1="306" x2="236" y2="338"/><line x1="256" y1="306" x2="256" y2="342"/><line x1="276" y1="306" x2="276" y2="338"/>
    </g>
  </g>
</svg>
